<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Concursos Bancários | Aprovação Passo a Passo</title>
    <meta name="description" content="Plataforma premium para concursos e carreiras bancárias." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/bancos.css" />
    <link rel="stylesheet" href="../css/cards.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body class="bancos-showcase">
    <div class="page-shell">
      <header class="site-header top-header glass-panel">
        <a class="brand" href="./bancos.html" aria-label="Aprovação Passo a Passo">
          <img class="brand__image" src="../images/logo/aprovacao-logo.svg" alt="Aprovação Passo a Passo" />
        </a>
      </header>

      <main class="page-main" id="courses">
        <section class="courses-stage" aria-labelledby="courses-title">
          <div class="courses-stage__intro">
            <span class="courses-stage__eyebrow">Plataforma premium de preparação para concursos bancários</span>
            <h1 id="courses-title">Aprovação Passo a Passo</h1>
            <p class="courses-stage__subtitle">Escolha seu curso, avance com método e estude com foco na sua vaga.</p>
          </div>

          <div class="banks-grid" id="banksGrid"></div>
        </section>
      </main>
    </div>

    <template id="bankCardTemplate">
      <article class="bank-card">
        <div class="bank-card__media">
          <div class="bank-card__image-wrap">
            <img class="bank-card__image" alt="" />
          </div>
          <span class="bank-card__status">PUBLICADO</span>
          <button class="bank-card__menu-button" type="button" aria-label="Abrir ações do card">⋮</button>
          <div class="bank-card__menu" hidden>
            <button type="button">Editar</button>
            <button type="button">Configurar</button>
            <button type="button">Alterar link</button>
            <button type="button">Alterar status</button>
            <button type="button" class="danger">Excluir</button>
          </div>
        </div>
        <div class="bank-card__body">
          <div class="bank-card__heading">
            <h2 class="bank-card__title"></h2>
            <span class="bank-card__sigla"></span>
            <p class="bank-card__subtitle"></p>
          </div>
          <div class="bank-card__action-slot">
            <div class="bank-card__purchase-row">
              <a class="bank-card__buy-button" href="#" target="_blank" rel="noopener noreferrer">
                <span>COMPRAR AGORA</span>
              </a>
              <a class="bank-card__cart-button" href="#" target="_blank" rel="noopener noreferrer" aria-label="Comprar curso">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h2l1.1 6h8.7l1.8-4.5H8.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="19" r="1.5" fill="currentColor"/><circle cx="17" cy="19" r="1.5" fill="currentColor"/><path d="M7 6l.7-2.2A1 1 0 0 1 8.6 3h2.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
              </a>
            </div>
          </div>
        </div>
      </article>
    </template>

    <script src="../js/main.js"></script>
    <script src="../js/bancos.js"></script>
  </body>
</html>
